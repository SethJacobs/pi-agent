# Add both service blocks to your home-server docker-compose.yml
# under the `services:` key.
# Add pi_agent_data and whatsapp_sessions to the `volumes:` key at the bottom.
#
# Port map (based on your existing stack):
#   8787 → pi-agent-harness  (free)
#   3002 → whatsapp-bridge   (3000 + 3001 are taken by homepage and open-webui)

  whatsapp-bridge:
    image: avoylenko/wwebjs-api:latest
    container_name: whatsapp-bridge
    restart: unless-stopped
    ports:
      - "3002:3000"
    volumes:
      - whatsapp_sessions:/app/sessions
    environment:
      - API_KEY=your_secret_token_here        # set this, copy value to WHATSAPP_TOKEN below
      - BASE_WEBHOOK_URL=http://pi-agent-harness:8787/webhook/whatsapp
      - DISABLED_CALLBACKS=onPresenceChanged,onGroupNotification
      - ENABLE_LOCAL_CALLBACK_EXAMPLE=FALSE
    networks:
      - vpn_net

  pi-agent-harness:
    build:
      context: /home/pi/home-server/pi-agent-harness
      dockerfile: deploy/Dockerfile
    container_name: pi-agent-harness
    restart: unless-stopped
    depends_on:
      - ai-gateway
      - homeassistant
      - paperless-webserver
      - whatsapp-bridge
    ports:
      - "8787:8787"
    volumes:
      - pi_agent_data:/app/data
      # Mount prompts so you can edit HEARTBEAT.md live without rebuilding
      - /home/pi/home-server/pi-agent-harness/prompts:/app/prompts:ro
    environment:
      - AGENT_NAME=HomeOps
      - SQLITE_PATH=/app/data/agent.db

      # Points at the gateway container on the internal network
      - ROUTER_BASE_URL=http://ai-gateway:8080
      - ROUTER_CHAT_PATH=/v1/chat/completions
      - ROUTER_API_KEY=        # set if GATEWAY_API_KEY is set in ai-gateway
      - ROUTER_MODEL=openrouter/auto

      # Home Assistant — internal container hostname
      - HOME_ASSISTANT_BASE_URL=http://homeassistant:8123
      - HOME_ASSISTANT_TOKEN=           # long-lived access token from HA profile page

      # Paperless — internal container hostname
      - PAPERLESS_BASE_URL=http://paperless-webserver:8000
      - PAPERLESS_TOKEN=       # get from Paperless UI → Settings → API Token

      # WhatsApp bridge — internal port is always 3000 regardless of host mapping
      - WHATSAPP_SEND_URL=http://whatsapp-bridge:3000/client/sendMessage/default
      - WHATSAPP_TOKEN=        # must match API_KEY in whatsapp-bridge above
      - WHATSAPP_DEFAULT_CHAT_ID=
      - WEBHOOK_SECRET=

      # Laundry entities from your existing setup
      - WATCH_ENTITY_IDS=["binary_sensor.zt300866n_laundry_remote_status","binary_sensor.av931535g_laundry_remote_status","sensor.zt300866n_laundry_machine_state","sensor.av931535g_laundry_machine_state"]
      - WATCHER_INTERVAL_SECONDS=60
      - PAPERLESS_POLL_SECONDS=600
      - HEARTBEAT_INTERVAL_SECONDS=1800

      - LOG_LEVEL=INFO
    networks:
      - vpn_net
    mem_limit: 128m
    cpus: "0.5"

# Add to your volumes: block
# volumes:
#   pi_agent_data:
#   whatsapp_sessions:
